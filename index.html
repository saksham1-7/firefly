<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>fireflies</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,500&family=Work+Sans:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ["Fraunces", "ui-serif", "Georgia", "serif"],
            sans: ['"Work Sans"', "ui-sans-serif", "system-ui", "sans-serif"],
          },
          colors: {
            night: { 950: "#05070d", 900: "#0a0f1c", 800: "#121a2c" },
            mist: { DEFAULT: "#8993a8", dim: "#5b6478" },
            paper: "#edf0f6",
          },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="style.css" />
</head>
<body class="night-sky font-sans text-paper">
  <div class="scene flex flex-col min-h-screen p-6 sm:p-10 md:p-12">

    <header class="site-header space-y-2 max-w-[34ch]">
      <h1 class="font-serif italic text-4xl sm:text-5xl md:text-6xl tracking-tight">
        fireflies
      </h1>
      <p class="text-mist text-base sm:text-lg leading-relaxed">
        each light here keeps its own private rhythm at first.
        it won't stay that way for long.
      </p>
    </header>

    <div class="firefly-field flex-1 relative my-4" aria-hidden="true">
     
    </div>


    <p class="swarm-status text-mist-dim text-sm">
  arriving&hellip;
</p>

<div class="coupling-control flex items-center gap-3 mt-2">
  <label for="coupling-slider" class="text-mist text-xs sm:text-sm">
    how strongly they pull toward each other
  </label>
  <input
    type="range"
    id="coupling-slider"
    min="0"
    max="1"
    step="0.01"
    value="0.35"
    class="coupling-slider"
  />
  <span id="coupling-value" class="text-mist-dim text-xs">0.35</span>
  <button id="scatter-button" class="scatter-button">scatter</button>
</div>

  </div>
  <script src="/socket.io/socket.io.js"></script>
<script src="/front.js"></script>
</body>
</html>
