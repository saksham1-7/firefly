<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>fireflies</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,500&family=Work+Sans:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ["Fraunces", "ui-serif", "Georgia", "serif"],
            sans: ['"Work Sans"', "ui-sans-serif", "system-ui", "sans-serif"],
          },
          colors: {
            night: { 950: "#05070d", 900: "#0a0f1c", 800: "#121a2c" },
            mist: { DEFAULT: "#8993a8", dim: "#5b6478" },
            paper: "#edf0f6",
          },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="style.css" />
</head>
<body class="night-sky font-sans text-paper">
  <div class="scene flex flex-col min-h-screen p-6 sm:p-10 md:p-12">

    <header class="site-header space-y-2 max-w-[34ch]">
      <h1 class="font-serif italic text-4xl sm:text-5xl md:text-6xl tracking-tight">
        fireflies
      </h1>
      <p class="text-mist text-base sm:text-lg leading-relaxed">
        each light here keeps its own private rhythm at first.
        it won't stay that way for long.
      </p>
    </header>

    <div class="firefly-field flex-1 relative my-4" aria-hidden="true">
      <div class="firefly" style="--x:8%;  --y:24%; --hue:48; --size:8px;  --duration:4.6s; --delay:-1.1s;"></div>
      <div class="firefly" style="--x:18%; --y:62%; --hue:58; --size:10px; --duration:3.8s; --delay:-2.4s;"></div>
      <div class="firefly" style="--x:27%; --y:15%; --hue:64; --size:7px;  --duration:5.1s; --delay:0.3s;"></div>
      <div class="firefly" style="--x:34%; --y:81%; --hue:52; --size:9px;  --duration:4.1s; --delay:-0.6s;"></div>
      <div class="firefly" style="--x:42%; --y:44%; --hue:70; --size:8px;  --duration:4.9s; --delay:-3.2s;"></div>
      <div class="firefly" style="--x:51%; --y:20%; --hue:46; --size:11px; --duration:3.5s; --delay:1.2s;"></div>
      <div class="firefly" style="--x:58%; --y:68%; --hue:60; --size:7px;  --duration:5.4s; --delay:-1.8s;"></div>
      <div class="firefly" style="--x:66%; --y:35%; --hue:55; --size:9px;  --duration:4.3s; --delay:-4.0s;"></div>
      <div class="firefly" style="--x:73%; --y:12%; --hue:66; --size:8px;  --duration:3.9s; --delay:0.8s;"></div>
      <div class="firefly" style="--x:80%; --y:55%; --hue:50; --size:10px; --duration:4.7s; --delay:-2.9s;"></div>
      <div class="firefly" style="--x:87%; --y:78%; --hue:62; --size:7px;  --duration:5.2s; --delay:-0.2s;"></div>
      <div class="firefly" style="--x:91%; --y:28%; --hue:44; --size:9px;  --duration:4.0s; --delay:1.6s;"></div>
      <div class="firefly" style="--x:14%; --y:88%; --hue:68; --size:8px;  --duration:3.6s; --delay:-3.7s;"></div>
      <div class="firefly" style="--x:60%; --y:6%;  --hue:56; --size:6px;  --duration:4.4s; --delay:-1.4s;"></div>
    </div>

    <p class="swarm-status text-mist-dim text-sm">
      14 fireflies here, still finding their rhythm.
    </p>

  </div>
  <script src="/socket.io/socket.io.js"></script>
<script src="/front.js"></script>
</body>
</html>
